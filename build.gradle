plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'java'
}

version = "1.0.0"
group = "com.meteorpatch"
base { archivesName = "meteor-patch-addon" }

repositories {
    // 阿里云镜像（加速底层依赖下载）
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.aliyun.com/repository/google" }
    maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.2"
    
    // 本地 Meteor 和 Baritone，只用来编译，不打包
    compileOnly files("libs/meteor-client-1.21.11-86.jar")
    compileOnly files("libs/baritone-fabric-1.21.11-1.11.1-12-g2748d587.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
